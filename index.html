<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiyanz - Semua Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(183, 148, 244, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #667eea;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Welcome Popup */
        .welcome-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .welcome-popup.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            animation: popupIn 0.6s ease-out forwards;
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .popup-content h2 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .popup-content p {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .ok-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .ok-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .ok-button:active {
            transform: translateY(0);
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
            position: relative;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .container.visible {
            opacity: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 45px;
            opacity: 0;
            animation: slideDown 0.6s ease-out 0.3s forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 42px;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.1);
            position: relative;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spinBorder 3s linear infinite;
        }

        @keyframes spinBorder {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 16px;
            font-weight: 400;
        }

        .section-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin: 35px 0 18px;
            padding-left: 12px;
            border-left: 3px solid #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            animation: slideRight 0.5s ease-out forwards;
        }

        .freelance-title {
            border-left-color: #FF9800;
        }

        .support-title {
            border-left-color: #FF6B6B;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 0.9;
                transform: translateX(0);
            }
        }

        .floating-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            display: block;
            margin: 0 auto 30px;
            width: 80%;
            max-width: 300px;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .freelance-button {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            box-shadow: 0 10px 30px rgba(255, 152, 0, 0.4);
        }

        .freelance-button:hover {
            box-shadow: 0 15px 40px rgba(255, 152, 0, 0.6);
        }

        .support-button {
            background: linear-gradient(135deg, #FF6B6B 0%, #C44569 100%);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .support-button:hover {
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .floating-button:hover {
            transform: translateY(-3px);
        }

        .links-overlay {
            position: fixed;

            background: rgba(10, 10, 10, 0.95);

        .links-overlay.active {

        }

        .links-content {
            position: relative;

            padding-top: 20px;
        }

        .circle-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
        }

        .circle-link {
            position: absolute;

            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: white;

            animation: circleAppear 0.5s ease-out forwards, float 3s ease-in-out infinite;

            z-index: 1;
            cursor: pointer;
        }

        .circle-link:hover {

        }

        .circle-icon {

        .circle-label {

        @keyframes circleAppear {

                opacity: 0;
                transform: scale(0.5) rotate(-180deg);

        @keyframes float {
            0%,

            }
            50% {

            }

        @keyframes fadeInUp {

        .overlay-title {

        }

        .popup-button:hover {

            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .popup-button.cancel {
            background: linear-gradient(135deg, #666, #333);

        .popup-button.confirm {

        @media (max-width: 480px) {

        // Fungsi untuk membuat lingkaran link dalam formasi melingkar
        function createCircleLinks(links, containerId, useSpecial = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            let radius;
            if (links.length <= 3) radius = 100;
            else if (links.length <= 5) radius = 120;
            else radius = 140;

            const centerX = container.offsetWidth / 2;
            const centerY = container.offsetHeight / 2;

            links.forEach((link, index) => {
                let x, y;
                // Untuk support (4 link) pakai formasi silang
                if (useSpecial && links.length === 4) {
                    switch (index) {
                        case 0:
                            x = centerX - 40;
                            y = centerY - radius - 40;
                            break;
                        case 1:
                            x = centerX + radius - 40;
                            y = centerY - 40;
                            break;
                        case 2:
                            x = centerX - 40;
                            y = centerY + radius - 40;
                            break;
                        case 3:
                            x = centerX - radius - 40;
                            y = centerY - 40;
                            break;
                    }
                } else {
                    const angle = (index / links.length) * 2 * Math.PI - Math.PI / 2;
                    x = centerX + radius * Math.cos(angle) - 40;
                    y = centerY + radius * Math.sin(angle) - 40;
                }

                const circleLink = document.createElement('div');
                circleLink.className = `circle-link ${link.class}`;
                circleLink.style.left = `${x}px`;
                circleLink.style.top = `${y}px`;
                circleLink.style.animationDelay = `${index * 0.1}s`;

                if (!link.customPopup) {
                    circleLink.addEventListener('click', function() {
                        window.open(link.url, '_blank');
                    });
                } else {
                    circleLink.addEventListener('click', function(e) {
                        e.stopPropagation();
                        showFreelancePopup(link);
                    });
                }

                const circleIcon = document.createElement('div');
                circleIcon.className = 'circle-icon';
                circleIcon.textContent = link.icon;

                const circleLabel = document.createElement('div');
                circleLabel.className = 'circle-label';
                circleLabel.textContent = link.label;

                circleLink.appendChild(circleIcon);
                circleLink.appendChild(circleLabel);
                container.appendChild(circleLink);
            });
        }
